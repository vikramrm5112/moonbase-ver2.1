<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUNAR OUTPOST ALPHA :: TERMINAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    .border-console-thin { border: 1px solid #15803d; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: var(--sb-track, #09090b); }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #15803d; }
    .dark { --sb-track: #09090b; }
    :root:not(.dark) { --sb-track: #f4f4f5; }

    /* Custom Tooltip Styles */
    .custom-tooltip {
      position: relative;
      display: inline-block;
      cursor: help;
      color: #d946ef;
      text-decoration: underline dotted;
    }
    .custom-tooltip .tooltip-text {
      visibility: hidden;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #09090b;
      color: #f5d0fe;
      border: 1px solid #d946ef;
      text-align: center;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 100;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .custom-tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body class="bg-zinc-100 text-green-900 dark:bg-black dark:text-green-500 font-mono min-h-screen flex flex-col p-2 sm:p-4 selection:bg-green-500 selection:text-black">

  <header class="border border-green-700 dark:border-green-800 bg-white dark:bg-zinc-950 p-3 mb-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
    <div>
      <h1 class="text-base font-black tracking-widest text-green-800 dark:text-green-400 uppercase">Lunar Outpost Alpha</h1>
      <p class="text-[10px] text-green-700">LOA-42-B // ALEX RIVERA</p>
    </div>
    
    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
      <div class="text-right flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto text-[11px]">
        <span class="text-green-800 dark:text-green-600 font-bold">[RF LINK: ONLINE]</span>
        <span id="lmt-clock" class="text-zinc-600 font-mono text-[10px]">SOL 1 :: 06:00 LST</span>
      </div>
      <button id="theme-toggle" onclick="toggleTheme()" class="bg-green-100 dark:bg-green-950 border border-green-700 dark:border-green-600 text-[10px] font-bold px-2 py-1 uppercase">[MODE: DARK]</button>
    </div>
  </header>

  <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-3 mb-3 min-h-0">
    
    <main class="lg:col-span-3 flex flex-col border border-green-700 dark:border-green-800 bg-white dark:bg-zinc-950 p-3 relative">
      <div id="chat-log" class="flex-1 overflow-y-auto space-y-4 pr-2 scrollbar-thin max-h-[55vh] lg:max-h-[60vh]">
        <div class="text-xs text-green-800 dark:text-green-700 italic border-b border-zinc-200 dark:border-zinc-800 pb-2">
          [SYSTEM INITIALIZED] Direct RF Link established. Auto-telemetry active.
        </div>
      </div>

      <form id="chat-form" class="mt-3 pt-3 border-t border-green-700 dark:border-green-900 flex gap-2">
        <input type="text" id="user-input" autocomplete="off" placeholder="Transmit command..." class="flex-1 bg-zinc-50 dark:bg-black border border-green-700 text-green-950 dark:text-green-400 px-3 py-2 text-sm focus:outline-none focus:border-green-500" />
        <button type="submit" id="send-btn" class="bg-green-800 dark:bg-green-950 text-white dark:text-green-400 border border-green-600 px-5 py-2 text-sm font-bold uppercase disabled:opacity-50">Transmit</button>
      </form>
    </main>

    <aside class="lg:col-span-1 flex flex-col border border-green-700 dark:border-green-800 bg-white dark:bg-zinc-950 p-3 space-y-3 max-h-[55vh] lg:max-h-[60vh]">
      <div class="border-b border-green-700 dark:border-green-900 pb-2">
        <div class="flex justify-between text-[11px] font-bold mb-1">
          <span>PROGRESS</span>
          <span id="sol-tracker-text">SOL 1 / 13</span>
        </div>
        <div class="w-full bg-zinc-200 dark:bg-zinc-900 h-2 border border-green-700 dark:border-green-900">
          <div id="sol-progress-bar" class="bg-green-600 dark:bg-green-500 h-full w-[7.6%] transition-all duration-500"></div>
        </div>
      </div>

      <div class="pt-2 space-y-2 flex-1">
        <button onclick="sendQuickCommand('Give me a full telemetry diagnostic read.')" class="w-full text-left text-[11px] bg-zinc-100 dark:bg-black text-green-900 dark:text-green-400 border border-green-700 dark:border-green-800 px-2 py-1.5 rounded">&gt; Diagnostic</button>
        <button onclick="sendQuickCommand('End of shift. Turn in and get some rest, Alex.')" class="w-full text-left text-[11px] bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-300 border border-green-700 dark:border-green-600 px-2 py-1.5 rounded font-bold">&gt; Rest Cycle</button>
      </div>
    </aside>
  </div>

  <footer class="grid grid-cols-4 sm:grid-cols-8 gap-2 text-center text-xs">
    <div id="box-PWR" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('PWR')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">PWR</div>
      <div id="val-PWR" class="font-extrabold text-sm">75%</div>
    </div>
    <div id="box-BATT" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('BATT')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">BATT</div>
      <div id="val-BATT" class="font-extrabold text-sm">80%</div>
    </div>
    <div id="box-O2" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('O2')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">O2</div>
      <div id="val-O2" class="font-extrabold text-sm">94%</div>
    </div>
    <div id="box-H2O" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('H2O')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">H2O</div>
      <div id="val-H2O" class="font-extrabold text-sm">88%</div>
    </div>
    <div id="box-FOOD" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('FOOD')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">FOOD</div>
      <div id="val-FOOD" class="font-extrabold text-sm">80%</div>
    </div>
    <div id="box-RAD" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('RAD')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">RAD</div>
      <div id="val-RAD" class="font-extrabold text-sm">12%</div>
    </div>
    <div id="box-HEALTH" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('HEALTH')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">HEALTH</div>
      <div id="val-HEALTH" class="font-extrabold text-sm">98%</div>
    </div>
    <div id="box-FATIGUE" class="p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative">
      <button onclick="openModal('FATIGUE')" class="absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-green-100 dark:bg-green-950 text-green-900 dark:text-green-400 border border-green-600 text-[8px] font-bold">!</button>
      <div class="text-[9px] font-bold">FATIGUE</div>
      <div id="val-FATIGUE" class="font-extrabold text-sm">18%</div>
    </div>
  </footer>

  <div id="telemetry-modal" class="hidden fixed inset-0 bg-black/50 dark:bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-zinc-950 border border-green-700 dark:border-green-500 p-5 max-w-md w-full text-xs space-y-3">
      <div class="flex justify-between items-center border-b border-green-700 dark:border-green-800 pb-2">
        <h2 id="modal-title" class="font-bold text-green-900 dark:text-green-400 uppercase text-sm">SYSTEM DETAIL</h2>
        <button onclick="closeModal()" class="font-bold">[X]</button>
      </div>
      <p id="modal-body" class="text-green-800 dark:text-green-600 whitespace-pre-wrap">Loading...</p>
      <button onclick="closeModal()" class="w-full py-1.5 bg-green-800 dark:bg-green-950 text-white dark:text-green-400 border border-green-600 font-bold uppercase">Acknowledge</button>
    </div>
  </div>

  <script>
    const chatLog = document.getElementById('chat-log');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const modal = document.getElementById('telemetry-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const themeToggleBtn = document.getElementById('theme-toggle');

    let history = [], currentSol = 1, currentLunarTime = "06:00 LST", isRequestPending = false;

    function toggleTheme() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        themeToggleBtn.innerText = '[MODE: LIGHT]';
      } else {
        htmlEl.classList.add('dark');
        themeToggleBtn.innerText = '[MODE: DARK]';
      }
    }

    const systemInfo = {
      PWR: "Photovoltaic Solar Array telemetry.",
      BATT: "Hab primary lithium storage.",
      O2: "Atmospheric oxygen scrubbers.",
      H2O: "Wastewater reclamation system.",
      FOOD: "Hydroponics and field rations.",
      RAD: "External radiation telemetry.",
      HEALTH: "Bio-monitor metrics.",
      FATIGUE: "Circadian load index."
    };

    function openModal(key) {
      modalTitle.innerText = `TELEMETRY :: ${key}`;
      const currentVal = document.getElementById(`val-${key}`)?.innerText || "N/A";
      modalBody.innerText = `${systemInfo[key] || 'No detail.'}\n\nCURRENT VALUE: ${currentVal}`;
      modal.classList.remove('hidden');
    }

    function closeModal() { modal.classList.add('hidden'); }

    function appendMessage(sender, text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = type === 'user' ? 'text-right' : 'text-left';
      
      const senderSpan = document.createElement('div');
      senderSpan.className = type === 'user' ? 'text-[10px] text-zinc-500 uppercase font-bold' : 'text-[10px] text-green-700 dark:text-green-600 uppercase font-bold';
      senderSpan.innerText = sender;

      const textDiv = document.createElement('div');
      textDiv.className = type === 'user' 
        ? 'inline-block bg-zinc-200 dark:bg-zinc-900 border border-zinc-400 dark:border-zinc-700 text-green-950 dark:text-green-300 px-3 py-1.5 text-xs rounded mt-0.5 text-left max-w-[85%]' 
        : 'inline-block bg-green-50 dark:bg-zinc-950 border border-green-600 dark:border-green-800 text-green-900 dark:text-green-400 px-3 py-1.5 text-xs rounded mt-0.5 max-w-[85%] whitespace-pre-wrap';
      
      if (type === 'bot') {
        textDiv.innerHTML = text;
      } else {
        textDiv.innerText = text;
      }

      msgDiv.appendChild(senderSpan);
      msgDiv.appendChild(textDiv);
      chatLog.appendChild(msgDiv);
      chatLog.scrollTop = chatLog.scrollHeight;
      return textDiv;
    }

    function sendQuickCommand(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event('submit'));
    }

    function updateSolTracker() {
      document.getElementById('sol-tracker-text').innerText = `SOL ${currentSol} / 13`;
      document.getElementById('sol-progress-bar').style.width = `${(currentSol / 13) * 100}%`;
      document.getElementById('lmt-clock').innerText = `SOL ${currentSol} :: ${currentLunarTime}`;
    }

    function updateTelemetryUI(telemetryData) {
      if (!telemetryData) return;
      Object.entries(telemetryData).forEach(([key, value]) => {
        const valEl = document.getElementById(`val-${key}`);
        const boxEl = document.getElementById(`box-${key}`);
        if (valEl) valEl.innerText = value;
        const numVal = parseInt(value, 10);
        if (boxEl && !isNaN(numVal)) {
          if ((key === 'BATT' || key === 'PWR') && numVal < 70) {
            boxEl.className = "p-1.5 bg-red-100 dark:bg-red-950 border-2 border-red-600 font-bold relative";
            if (valEl) valEl.className = "font-black text-red-700 dark:text-red-400 text-sm";
          } else if ((key === 'BATT' || key === 'PWR') && numVal >= 70) {
            boxEl.className = "p-1.5 bg-white dark:bg-zinc-950 border-console-thin relative";
            if (valEl) valEl.className = "font-extrabold text-green-700 dark:text-green-400 text-sm";
          }
        }
      });
    }

    async function sendTransmission(messageText, isAutoPing = false) {
      if (isRequestPending) return;
      isRequestPending = true;
      sendBtn.disabled = true;

      if (!isAutoPing) {
        appendMessage('MISSION CONTROL', messageText, 'user');
        userInput.value = '';
      } else {
        const autoNotice = document.createElement('div');
        autoNotice.className = 'text-[10px] text-zinc-500 italic text-center border-y border-zinc-300 dark:border-zinc-900 py-0.5 my-1';
        autoNotice.innerText = '[AUTOMATED TELEMETRY BEACON]';
        chatLog.appendChild(autoNotice);
      }

      const loadingDiv = appendMessage('ALEX RIVERA', 'TRANSMITTING VIA RF LINK...', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: messageText, history, currentSol, lunarTime: currentLunarTime })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed.');

        loadingDiv.innerText = data.reply;
        if (data.nextLunarTime) currentLunarTime = data.nextLunarTime;
        if (data.shouldAdvanceSol) {
          currentSol += 1;
          currentLunarTime = "06:00 LST";
          appendMessage('SYSTEM', `--- ADVANCING TO SOL ${currentSol} ---`, 'bot');
        }
        updateSolTracker();
        if (data.telemetry) updateTelemetryUI(data.telemetry);

        history.push({ role: 'user', parts: [{ text: messageText }] });
        history.push({ role: 'model', parts: [{ text: data.reply }] });
      } catch (err) {
        loadingDiv.innerText = 'ERROR: ' + err.message;
        loadingDiv.classList.add('text-red-600');
      } finally {
        isRequestPending = false;
        sendBtn.disabled = false;
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;
      sendTransmission(message, false);
    });

    setInterval(() => {
      if (!isRequestPending) sendTransmission("[AUTOMATED 30S TELEMETRY & STATUS UPDATE REQUEST]", true);
    }, 30000);
  </script>
</body>
</html>
